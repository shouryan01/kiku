[package]
name = "kiku"
version = "0.1.0"
edition = "2024"
description = "Fast, low-RAM cross-platform voice dictation app"

[dependencies]
arboard = "3.7.0"
cpal = "0.18.2"
earshot = "1.2.2"
enigo = "0.6.1"
flacenc = "0.5.1"
nnnoiseless = "0.5.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "charset", "http2", "json", "multipart", "native-tls"] }
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media_Control",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
