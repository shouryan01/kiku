[package]
name = "kiku"
version = "0.1.0"
edition = "2024"
description = "Fast, low-RAM cross-platform voice dictation app"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "charset", "http2", "json", "multipart", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
