name: CI & Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Shared validation steps run once before OS-specific builds
  check-and-test:
    name: Shared Lint, Clippy & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit, integration & performance tests
        run: cargo test --all-targets -- --nocapture

  build-macos:
    name: Build macOS Binary
    needs: check-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Package macOS artifact
        run: |
          mkdir -p dist
          cp target/release/kiku dist/kiku
          tar -czf kiku-macos.tar.gz -C dist kiku

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: kiku-macos
          path: kiku-macos.tar.gz

  # Uncomment when ready to add Windows builds:
  # build-windows:
  #   name: Build Windows Binary
  #   needs: check-and-test
  #   runs-on: windows-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #
  #     - name: Install Rust stable
  #       uses: dtolnay/rust-toolchain@stable
  #
  #     - uses: Swatinem/rust-cache@v2
