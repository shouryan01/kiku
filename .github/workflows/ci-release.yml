  #       shell: pwsh
  #       run: |
  #         New-Item -ItemType Directory -Force -Path dist | Out-Null
  #         Copy-Item target/release/kiku.exe dist/kiku.exe
  #         Compress-Archive -Path dist/kiku.exe -DestinationPath kiku-windows.zip
  #
  #     - name: Upload Windows artifact
  #       uses: actions/upload-artifact@v7
  #       with:
  #         name: kiku-windows
  #         path: kiku-windows.zip

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Compute release tag
        id: tag
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)
          echo "tag=v${VERSION}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "kiku ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          files: |
            artifacts/kiku-macos/kiku-macos.tar.gz
